# Web server port — mapped to Spring's server.port by the bridge.
portalserver.port=9092

# React UI port — read by stubserver-ui/server.js at startup (npm run serve).
# Change this + restart the UI server to change the port (no rebuild).
ui.port=9091

# App settings (env-specific URLs / core server)
app.cors-origin=https://your-prod-domain.com
app.prod-url=https://your-prod-domain.com
app.core-server.port=9093
app.core-server.name=StubServer