plugins {
    id 'groovy'
    id 'java'
    id 'application'
}

group = 'org.framework'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass = 'org.framework.Main' // Replace with your actual package and class name
}

mainClassName = 'org.framework.Main'

sourceSets {
    main {
        java {
            srcDirs += ['../StubEngineUtil/src']
        }
    }
}

dependencies {
    implementation 'org.apache.groovy:groovy-xml:4.0.5'
    implementation 'wsdl4j:wsdl4j:1.6.3'
    implementation 'org.apache.groovy:groovy-dateutil:4.0.17'
    implementation 'org.apache.groovy:groovy-datetime:4.0.17'
    implementation 'org.apache.groovy:groovy-all:4.0.17'
    implementation 'org.apache.groovy:groovy:4.0.17'
    implementation 'org.apache.groovy:groovy-json:4.0.17'
    implementation 'org.apache.groovy:groovy-sql:4.0.17'
    implementation 'org.json:json:20230227'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:9.4.1.jre11'
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-sqlserver:10.20.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'com.oracle.database.jdbc:ojdbc8:19.3.0.0'
    implementation 'org.apache.groovy:groovy-dateutil:4.0.17'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'net.minidev:json-smart:2.4.8'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'org.apache.derby:derby:10.17.1.0'
    implementation 'org.apache.derby:derbytools:10.17.1.0'

    implementation 'org.apache.mina:mina-core:2.1.5'
    implementation 'io.github.librewsdl4j:libre-wsdl4j:1.12.0'
    implementation 'org.eclipse.jetty:jetty-server:11.0.18'
    implementation 'org.eclipse.jetty:jetty-servlet:11.0.18'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.13'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.8'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.8'

    // StubEngineUtil (com.stubio.*) uses jakarta.xml.bind, not javax.xml.bind
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'

    implementation files("$projectDir/customJar/hibernate-1.0-SNAPSHOT.jar")
    implementation fileTree(dir: 'customJar', include: ['*.jar'])

    testImplementation files("$projectDir/customJar/hibernate-1.0-SNAPSHOT.jar")
    testImplementation fileTree(dir: 'customJar', include: ['*.jar'])

    // Hibernate ORM
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'

    // JPA API
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // for JSON

}

test {
    useJUnitPlatform()
}

tasks.register('printCompileClasspath') {
    doLast {
        configurations.compileClasspath.files.each {
            println it.absolutePath
        }
    }
}

jar {

    manifest {
        attributes(
                'Main-Class': mainClassName,
                'Class-Path': configurations.runtimeClasspath.collect { "../lib/${it.name}" }.join(' ')
        )
    }
}

task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into "${buildDir}/lib"
}

jar.dependsOn copyDependencies
